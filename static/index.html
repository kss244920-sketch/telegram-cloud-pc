<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cloud PC Terminal</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- xterm.js CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-web-links@0.11.0/lib/addon-web-links.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #1a1b26;
      color: #c0caf5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }
    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background-color: #16161e;
      border-bottom: 1px solid #292e42;
      font-size: 13px;
    }
    .top-left { display: flex; align-items: center; gap: 8px; }
    .status-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background-color: #f7768e;
      box-shadow: 0 0 6px #f7768e;
    }
    .status-dot.connected {
      background-color: #9ece6a;
      box-shadow: 0 0 6px #9ece6a;
    }
    .badge {
      background: #24283b; padding: 2px 6px; border-radius: 4px; font-size: 11px;
    }
    /* Tab Contents */
    .tab-content { flex: 1; display: none; overflow: hidden; position: relative; }
    .tab-content.active { display: flex; flex-direction: column; }
    
    /* Terminal Area */
    #terminal-container {
      flex: 1;
      background: #1a1b26;
      padding: 4px;
      overflow: hidden;
    }
    /* Shortcut Rows */
    .shortcuts-container {
      background-color: #16161e;
      border-top: 1px solid #292e42;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 4px 6px;
    }
    .shortcuts-row {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .shortcuts-row::-webkit-scrollbar { display: none; }
    .key-btn {
      background: #24283b;
      color: #7aa2f7;
      border: 1px solid #414868;
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: bold;
      white-space: nowrap;
      cursor: pointer;
      active: scale(0.95);
    }
    .key-btn:active { background: #3b4261; color: #fff; }
    
    /* Quick Input Bar */
    .quick-input-bar {
      display: flex;
      gap: 6px;
      padding: 6px;
      background: #16161e;
      border-top: 1px solid #24283b;
    }
    .quick-input-bar input {
      flex: 1;
      background: #24283b;
      border: 1px solid #414868;
      border-radius: 4px;
      color: #fff;
      padding: 6px 10px;
      font-size: 13px;
      outline: none;
    }
    .quick-input-bar button {
      background: #7aa2f7;
      color: #1a1b26;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      padding: 6px 14px;
      cursor: pointer;
    }

    /* Scroll to Bottom Button */
    .scroll-bottom-btn {
      position: absolute;
      right: 14px;
      bottom: 120px;
      background: #7aa2f7;
      color: #16161e;
      border: none;
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      display: none;
      box-shadow: 0 4px 8px rgba(0,0,0,0.5);
    }

    /* Tabs Bar */
    .bottom-nav {
      display: flex;
      background: #13131a;
      border-top: 1px solid #292e42;
    }
    .nav-btn {
      flex: 1;
      padding: 8px 4px;
      text-align: center;
      background: none;
      border: none;
      color: #565f89;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .nav-btn.active { color: #7aa2f7; font-weight: bold; }

    /* Other Tab Views */
    .pane-view {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      font-size: 13px;
    }
    .item-card {
      background: #24283b;
      border: 1px solid #414868;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <!-- Header Bar -->
  <div class="top-bar">
    <div class="top-left">
      <div id="statusDot" class="status-dot"></div>
      <strong id="projectName">Cloud PC</strong>
      <span id="connStatus" class="badge">Connecting...</span>
    </div>
    <div id="serviceStatus" class="badge">Render Free</div>
  </div>

  <!-- Tab 1: Terminal -->
  <div id="tabTerminal" class="tab-content active">
    <div id="terminal-container"></div>
    <button id="scrollBottomBtn" class="scroll-bottom-btn" onclick="scrollToBottom()">⬇️ Neeche Jao</button>

    <!-- Mobile Shortcuts -->
    <div class="shortcuts-container">
      <div class="shortcuts-row">
        <button class="key-btn" onclick="sendKey('\x0f')">Ctrl+O</button>
        <button class="key-btn" onclick="sendKey('\x03')">Ctrl+C</button>
        <button class="key-btn" onclick="sendKey('\x1b')">Esc</button>
        <button class="key-btn" onclick="sendKey('\t')">Tab</button>
        <button class="key-btn" onclick="sendKey('\x1b[A')">↑</button>
        <button class="key-btn" onclick="sendKey('\x1b[B')">↓</button>
        <button class="key-btn" onclick="sendKey('\x1b[D')">←</button>
        <button class="key-btn" onclick="sendKey('\x1b[C')">→</button>
        <button class="key-btn" onclick="sendKey('\r')">Enter</button>
      </div>
      <div class="shortcuts-row">
        <button class="key-btn" onclick="sendKey('\x04')">Ctrl+D</button>
        <button class="key-btn" onclick="sendKey('\x0c')">Ctrl+L (Clear)</button>
        <button class="key-btn" onclick="sendKey('/')">/</button>
        <button class="key-btn" onclick="sendKey('-')">-</button>
        <button class="key-btn" onclick="sendKey('~')">~</button>
        <button class="key-btn" onclick="sendKey('|')">|</button>
        <button class="key-btn" onclick="pasteClipboard()">Paste</button>
      </div>
    </div>

    <!-- Quick Text Input for Mobile -->
    <div class="quick-input-bar">
      <input type="text" id="quickInput" placeholder="Command ya instruction type karein..." onkeydown="if(event.key==='Enter') sendInputText()">
      <button onclick="sendInputText()">Send</button>
    </div>
  </div>

  <!-- Tab 2: Files -->
  <div id="tabFiles" class="tab-content">
    <div class="pane-view" id="filesList">
      <p style="color:#7aa2f7;">📁 Project Files load ho rahi hain...</p>
    </div>
  </div>

  <!-- Tab 3: History -->
  <div id="tabHistory" class="tab-content">
    <div class="pane-view" id="historyList">
      <p style="color:#7aa2f7;">📜 Past sessions and summaries...</p>
    </div>
  </div>

  <!-- Tab 4: Queue -->
  <div id="tabQueue" class="tab-content">
    <div class="pane-view" id="queueList">
      <p style="color:#7aa2f7;">📋 Tasks queue load ho rahi hai...</p>
    </div>
  </div>

  <!-- Tab 5: Status -->
  <div id="tabStatus" class="tab-content">
    <div class="pane-view" id="systemStatusView">
      <div class="item-card">
        <h3>Server Metrics</h3>
        <p id="ramMetrics">RAM: checking...</p>
        <p id="uptimeMetrics">Uptime: checking...</p>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <div class="bottom-nav">
    <button class="nav-btn active" onclick="switchTab('tabTerminal', this)">📟 Terminal</button>
    <button class="nav-btn" onclick="switchTab('tabFiles', this)">📁 Files</button>
    <button class="nav-btn" onclick="switchTab('tabHistory', this)">📜 History</button>
    <button class="nav-btn" onclick="switchTab('tabQueue', this)">📋 Queue</button>
    <button class="nav-btn" onclick="switchTab('tabStatus', this)">📊 Status</button>
  </div>

  <script>
    // Initialize Telegram WebApp
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    const initData = tg?.initData || "";
    let term, fitAddon, socket;

    function initTerminal() {
      term = new Terminal({
        convertEol: true,
        scrollback: 10000,
        theme: {
          background: '#1a1b26',
          foreground: '#c0caf5',
          cursor: '#7aa2f7',
          black: '#15161e',
          red: '#f7768e',
          green: '#9ece6a',
          yellow: '#e0af68',
          blue: '#7aa2f7',
          magenta: '#bb9af7',
          cyan: '#7dcfff',
          white: '#a9b1d6',
        },
        fontFamily: 'monospace',
        fontSize: 13,
        lineHeight: 1.2,
        cursorBlink: true,
      });

      fitAddon = new FitAddon.FitAddon();
      term.loadAddon(fitAddon);
      if (window.WebLinksAddon) {
        term.loadAddon(new WebLinksAddon.WebLinksAddon());
      }
      term.open(document.getElementById('terminal-container'));
      fitAddon.fit();

      term.onData(data => {
        if (socket && socket.readyState === WebSocket.OPEN) {
          socket.send(data);
        }
      });

      window.addEventListener('resize', () => {
        fitAddon.fit();
      });

      connectWebSocket();
    }

    function connectWebSocket() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${window.location.host}/ws/terminal?initData=${encodeURIComponent(initData)}`;
      
      updateConnState(false, "Connecting...");
      socket = new WebSocket(wsUrl);

      socket.onopen = () => {
        updateConnState(true, "Connected");
        term.writeln("\r\n\x1b[32m✔ Connected to Cloud PC Terminal Session\x1b[0m\r\n");
      };

      socket.onmessage = (event) => {
        term.write(event.data);
      };

      socket.onclose = () => {
        updateConnState(false, "Disconnected");
        term.writeln("\r\n\x1b[31m✖ Connection lost. Reconnecting in 3s...\x1b[0m\r\n");
        setTimeout(connectWebSocket, 3000);
      };

      socket.onerror = () => {
        updateConnState(false, "Error");
      };
    }

    function updateConnState(connected, text) {
      const dot = document.getElementById("statusDot");
      const label = document.getElementById("connStatus");
      if (connected) {
        dot.classList.add("connected");
      } else {
        dot.classList.remove("connected");
      }
      label.innerText = text;
    }

    function sendKey(chars) {
      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send(chars);
      }
    }

    function sendInputText() {
      const input = document.getElementById("quickInput");
      const val = input.value;
      if (val && socket && socket.readyState === WebSocket.OPEN) {
        socket.send(val + "\r");
        input.value = "";
      }
    }

    async function pasteClipboard() {
      try {
        const text = await navigator.clipboard.readText();
        if (text && socket) {
          socket.send(text);
        }
      } catch (e) {
        alert("Clipboard permission required to paste");
      }
    }

    function scrollToBottom() {
      term.scrollToBottom();
    }

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');

      if (tabId === 'tabTerminal') {
        setTimeout(() => fitAddon?.fit(), 100);
      } else if (tabId === 'tabStatus') {
        fetchStatus();
      }
    }

    async function fetchStatus() {
      try {
        const res = await fetch('/api/system-info');
        const data = await res.json();
        document.getElementById('ramMetrics').innerText = `RAM: ${data.ram} | CPU: ${data.cpu}`;
        document.getElementById('uptimeMetrics').innerText = `Uptime: ${data.uptime}`;
        
        const badge = document.getElementById('serviceStatus');
        if (data.agy_installed) {
          badge.innerText = `agy ${data.agy_version.split(' ')[0]}`;
          badge.style.color = '#9ece6a';
        } else {
          badge.innerText = 'agy not found';
          badge.style.color = '#f7768e';
        }
      } catch(e) {}
    }

    window.onload = () => {
      initTerminal();
      fetchStatus();
    };
  </script>
</body>
</html>
